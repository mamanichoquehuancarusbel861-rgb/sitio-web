<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - M.A.S. S.A.C.</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

    <div class="login-container">
        <h2>Panel Administrativo</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        <p id="error-msg" style="color: #ff6b6b; margin-top: 10px; font-size: 14px; text-align: center;"></p>
        <a href="index.html" class="back-link">← Volver al sitio público</a>
    </div>

    <!-- Script de autenticación con PocketBase para Superusuarios -->
    <script type="module">
        import PocketBase from 'https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.es.mjs';
        const pb = new PocketBase('http://127.0.0.1:8090');

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            // Evita que la página se recargue por defecto
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Autenticación con la colección interna de administradores (_superusers)
                await pb.collection('_superusers').authWithPassword(email, password);
                
                alert('¡Inicio de sesión exitoso!');
                window.location.href = 'admin.html'; // Redirige al panel de control
                
            } catch (error) {
                console.error('Error de autenticación:', error);
                errorMsg.textContent = 'Correo o contraseña incorrectos.';
            }
        });
    </script>
</body>
</html>
